name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build plugin and tests
        run: cmake --build build --config Release --target ThereBend_VST3 ThereBendTests --parallel

      - name: Run engine tests
        run: build\ThereBendTests_artefacts\Release\ThereBendTests.exe

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -Recurse build\ThereBend_artefacts\Release\VST3\ThereBend.vst3 dist\
          Copy-Item README.md dist\
          Compress-Archive -Path dist\* -DestinationPath ThereBend-Windows-VST3.zip -Force

      - uses: actions/upload-artifact@v5
        with:
          name: ThereBend-Windows-VST3
          path: dist/

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ThereBend-Windows-VST3.zip
